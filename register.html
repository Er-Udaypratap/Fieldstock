<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Fieldstock</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo"><span class="mark"></span>Fieldstock</a>
    <nav class="main-nav">
      <a href="index.html">Shop</a>
      <a href="index.html#catalog">Categories</a>
      <a href="cart.html">Cart</a>
    </nav>
    <div class="nav-account">
      <a href="cart.html" class="cart-link">
        Cart <span class="cart-count" data-cart-count>0</span>
      </a>
      <a href="login.html" data-account-link>Login</a>
    </div>
  </div>
</header>

<div class="form-page">
  <h1>Create an account</h1>
  <p>Takes about thirty seconds. No spam, just order updates.</p>

  <form id="registerForm">
    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" minlength="6" required>
    </div>
    <div class="field">
      <label for="confirmPassword">Confirm password</label>
      <input type="password" id="confirmPassword" minlength="6" required>
    </div>
    <div class="form-error" id="registerError"></div>
    <button type="submit" class="btn btn-primary btn-block">Create account</button>
  </form>

  <p class="form-switch">Already have an account? <a href="login.html">Log in</a></p>
</div>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
</body>
</html>
