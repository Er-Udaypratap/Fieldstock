<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Fieldstock</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo"><span class="mark"></span>Fieldstock</a>
    <nav class="main-nav">
      <a href="index.html">Shop</a>
      <a href="index.html#catalog">Categories</a>
      <a href="cart.html">Cart</a>
    </nav>
    <div class="nav-account">
      <a href="cart.html" class="cart-link">
        Cart <span class="cart-count" data-cart-count>0</span>
      </a>
      <a href="login.html" data-account-link>Login</a>
    </div>
  </div>
</header>

<div class="container">
  <div style="max-width:640px; margin:0 auto; padding-top:48px;">
    <div class="steps">
      <div class="step"><span class="num">1</span> Cart</div>
      <div class="step active"><span class="num">2</span> Delivery</div>
      <div class="step"><span class="num">3</span> Confirmation</div>
    </div>

    <h1 style="font-size:1.8rem;">Delivery details</h1>
    <p style="margin-bottom:28px;">This information is stored locally for the demo — a live backend will process it as a real order.</p>

    <form id="checkoutForm">
      <div class="field">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" required>
      </div>
      <div class="field">
        <label for="address">Address</label>
        <textarea id="address" rows="3" required></textarea>
      </div>
      <div class="form-row-split">
        <div class="field">
          <label for="city">City</label>
          <input type="text" id="city" required>
        </div>
        <div class="field">
          <label for="pincode">Pincode</label>
          <input type="text" id="pincode" required>
        </div>
      </div>
      <div class="field">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" required>
      </div>

      <div class="summary-box" style="margin:24px 0;">
        <div class="summary-row"><span>Items</span><span id="checkoutItemCount"></span></div>
        <div class="summary-row"><span>Subtotal</span><span id="checkoutSubtotal"></span></div>
        <div class="summary-row"><span>Delivery</span><span>Free</span></div>
        <div class="summary-row total"><span>Total</span><span id="checkoutTotal"></span></div>
      </div>

      <div class="form-error" id="checkoutError"></div>
      <button type="submit" class="btn btn-accent btn-block">Place order</button>
    </form>
  </div>
</div>

<footer class="site-footer">
  <div class="container" style="display:flex; justify-content:space-between; width:100%;">
    <span>Fieldstock — utility goods</span>
    <span>Built for the CodeAlpha internship task</span>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
</body>
</html>
